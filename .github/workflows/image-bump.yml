name: Image bump

# Polls the otp2 image on Google Container Registry for the
# newest release tag (v<major>.<minor>.<patch>-entur-<n>, pushed by
# entur/OpenTripPlanner's docker-build workflow). If that tag is newer than the
# pin in helm/otp2int/values.yaml on main, it puts the bump on the branch
# chore/update-otp and opens a pull request. If the pull request is already
# open, it updates that pull request instead.
#
# The branch is owned by this workflow. Each update rebuilds the branch from
# main and force-pushes it, so manual commits on the branch are lost.
#
# The registry also carries non-release tags (e.g. test-oracle-graal-vm-25),
# so only tags that match the release pattern are used. Release tags are
# compared by version, not by push time, so a late hotfix for an older line
# does not cause a downgrade.
#
# Pull requests opened with the default GITHUB_TOKEN deliberately do not
# trigger other workflows (GitHub's loop-prevention), which would silently
# stop the PR checks (build.yml, pr.yml) from running. OTP2INT_GITFLOW_PAT is a
# PAT from a bot/machine GitHub account with `contents: write` and
# `pull-requests: write` on this repo. Store it as a repo secret named
# OTP2INT_GITFLOW_PAT (Settings -> Secrets and variables -> Actions).

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: image-bump
  cancel-in-progress: false

env:
  BRANCH_NAME: chore/update-otp
  IMAGE_PIN_PATTERN: '(?<=identifier: eu\.gcr\.io/entur-system-1287/otp2:)\S+'

jobs:
  bump:
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.OTP2INT_GITFLOW_PAT }}

      - name: Authenticate to GCP
        uses: entur/gha-meta/.github/actions/cloud-auth@v1
        with:
          environment: dev
          cloud_provider: gcp
          gcp_workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ vars.SERVICE_ACCOUNT }}

      - name: Find newest otp2 release tag on GCR
        id: latest
        run: |
          LATEST_TAG=$(gcloud container images list-tags eu.gcr.io/entur-system-1287/otp2 --format=json \
            | jq -r '.[] | .tags[]? | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+-entur-[0-9]+$"))' \
            | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::could not resolve an otp2 release tag from GCR"
            exit 1
          fi
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Compare with pinned image
        id: compare
        env:
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          GH_TOKEN: ${{ secrets.OTP2INT_GITFLOW_PAT }}
        run: |
          MAIN_TAG=$(grep -oP "$IMAGE_PIN_PATTERN" helm/otp2int/values.yaml || true)
          if [ -z "$MAIN_TAG" ]; then
            echo "::error::could not find the otp2 image pin in helm/otp2int/values.yaml"
            exit 1
          fi
          NEWEST_TAG=$(printf '%s\n%s\n' "$MAIN_TAG" "$LATEST_TAG" | sort -V | tail -n 1)
          if [ "$NEWEST_TAG" = "$MAIN_TAG" ]; then
            echo "Pin $MAIN_TAG on main is already the newest release (GCR newest: $LATEST_TAG)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OPEN_PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number // empty')
          BRANCH_TAG=""
          if git fetch --quiet origin "$BRANCH_NAME"; then
            BRANCH_TAG=$(git show FETCH_HEAD:helm/otp2int/values.yaml | grep -oP "$IMAGE_PIN_PATTERN" || true)
          fi
          if [ -n "$OPEN_PR_NUMBER" ] && [ "$BRANCH_TAG" = "$LATEST_TAG" ]; then
            echo "PR #$OPEN_PR_NUMBER already bumps to $LATEST_TAG"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "open_pr_number=$OPEN_PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Push image bump and open or update pull request
        if: steps.compare.outputs.changed == 'true'
        env:
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          OPEN_PR_NUMBER: ${{ steps.compare.outputs.open_pr_number }}
          GH_TOKEN: ${{ secrets.OTP2INT_GITFLOW_PAT }}
        run: |
          COMMIT_TITLE="chore(deps): bump otp2 image to $LATEST_TAG"
          PR_BODY="Bumps the otp2 image to \`$LATEST_TAG\`.

          Build a graph with the new image before you merge:
          1. Run \`deploy.yml\` from the branch \`$BRANCH_NAME\` (\"Use workflow from\"). This deploys \`$LATEST_TAG\` to dev.
          2. Run \`run-graph-builder.yml\` and make sure the graph builds.
          3. Merge. The merge to \`main\` starts \`deploy.yml\` again from \`main\`."

          sed -i "s#identifier: eu\.gcr\.io/entur-system-1287/otp2:.*#identifier: eu.gcr.io/entur-system-1287/otp2:$LATEST_TAG#" helm/otp2int/values.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$BRANCH_NAME"
          git add helm/otp2int/values.yaml
          git commit -m "$COMMIT_TITLE"
          git push --force origin "$BRANCH_NAME"

          if [ -n "$OPEN_PR_NUMBER" ]; then
            gh pr edit "$OPEN_PR_NUMBER" --title "$COMMIT_TITLE" --body "$PR_BODY"
          else
            gh pr create --base main --head "$BRANCH_NAME" --title "$COMMIT_TITLE" --body "$PR_BODY"
          fi
