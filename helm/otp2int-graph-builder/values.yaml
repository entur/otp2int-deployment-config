configMap:
  logbackConfig: env/logback.xml

# The graph builders write the graphs here, and the serving pods read them from here.
# Keep this the same as environmentValues.otp2intGcpBaseName in the otp2int chart.
environmentValues:
  otp2intGcpBaseName: "gs://ror-otp-graphs-gcp2int-dev/"

image:
  identifier: eu.gcr.io/entur-system-1287/otp2:v2.11.0-entur-94
  imagePullPolicy: Always

build:
  number: <+artifacts.primary.tag>

mardukBucket: "marduk-dev"
mardukInternalBucket: "ror-marduk-internal-dev"
swedenBucket: "ror-kumarbi-idefix-output-dev"

resources:
  cpuLimit: 5000m
  memLimit: 26000Mi
  cpuRequest: 5000m
  memRequest: 24000Mi
  xmx: 20g
  xms: 512m
