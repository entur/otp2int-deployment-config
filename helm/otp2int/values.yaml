env: jp-dev

replicas: 1

horizontalPodAutoscaler:
  enabled: true
  maxReplicas: 10
  minReplicas: 1
  targetCPUUtilizationPercentage: 70

rollingUpdate:
  maxSurge: 0
  maxUnavailable: 1

resources:
  cpuLimit: "8"
  memLimit: 22000Mi
  cpuRequest: "2"
  memRequest: 20000Mi
  xmx: 18g
  xms: 18g

configMap:
  logbackConfig: env/logback.xml

# The serving pods read the graphs from here, and the graph builders write them here.
# Keep this the same as environmentValues.otp2intGcpBaseName in the otp2int-graph-builder chart.
environmentValues:
  otp2intGcpBaseName: "gs://ror-otp-graphs-gcp2int-dev/"

image:
  identifier: eu.gcr.io/entur-system-1287/otp2:v2.11.0-entur-94
  imagePullPolicy: Always

build:
  number: <+artifacts.primary.tag>

service:
  externalPort: 8080
  internalPort: 8080

maxConcurrentRoutingRequests: 2

