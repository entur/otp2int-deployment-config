# Build Workflow
#
# Lints the Helm chart on every pull request. Terraform is linted in terraform.yml.
# This repository has no Docker image, so there is no test, Docker build, scan or push step.
# Deployment happens in deploy.yml after merge to main.

name: Build

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'terraform/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-lint:
    uses: entur/gha-helm/.github/workflows/lint.yml@080c3d42794f3be06b42e3a81ff23a3a0e3b0235 # v2.1.0
    with:
      environment: dev
      chart: helm/otp2int
      values: values-kub-ent-jp-dev.yaml
