env: jp-dev

replicas: 1

horizontalPodAutoscaler:
  enabled: true
  maxReplicas: 10
  minReplicas: 1
  targetCPUUtilizationPercentage: 70

rollingUpdate:
  maxSurge: 0
  maxUnavailable: 1

resources:
  cpuLimit: "8"
  memLimit: 22000Mi
  cpuRequest: "2"
  memRequest: 20000Mi
  xmx: 18g
  xms: 18g

configMap:
  logbackConfig: env/logback.xml

environmentValues:
  otp2intGcpBaseName: "gs://ror-otp-graphs-gcp2int-dev/"

# Image of the serving pods. To update OTP, use two commits:
# 1. Set cronjobGraphBuilder.image to the new image. The deploy builds the graphs with it.
# 2. When the graph build succeeds, set image.identifier to the same image.
# The deploy stops if image.identifier changes before graphs are built with that image.
image:
  identifier: eu.gcr.io/entur-system-1287/otp2:v2.11.0-entur-94
  imagePullPolicy: Always

build:
  number: <+artifacts.primary.tag>

service:
  externalPort: 8080
  internalPort: 8080

maxConcurrentRoutingRequests: 2

cronjobGraphBuilder:
  # Image of the graph builder CronJobs. See the update steps at image.identifier.
  image: eu.gcr.io/entur-system-1287/otp2:v2.11.0-entur-94
  imagePullPolicy: Always
  mardukBucket: "marduk-dev"
  mardukInternalBucket: "ror-marduk-internal-dev"
  swedenBucket: "ror-kumarbi-idefix-output-dev"
  resources:
    cpuLimit: 5000m
    memLimit: 26000Mi
    cpuRequest: 5000m
    memRequest: 24000Mi
    xmx: 20g
    xms: 512m

