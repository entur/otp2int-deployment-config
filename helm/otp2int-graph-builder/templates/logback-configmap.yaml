apiVersion: v1
kind: ConfigMap
metadata:
  name: graph-builder-otp2int-logback-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "graph.builder.labels" . | indent 4 }}
  annotations:
      {{- include "common.annotations" . | indent 4 }}
data:
  logback.xml: |-{{ range .Files.Lines .Values.configMap.logbackConfig}}
    {{ . }}{{ end }}
